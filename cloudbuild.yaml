# CI/CD on Google Cloud: test, build, deploy. Trigger on push to main.
steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "pip install -q -r requirements.txt pytest httpx && DISABLE_FIRESTORE=1 GEMINI_MAX_ATTEMPTS=1 python -m pytest -q tests"]
  - id: build
    name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/groundtruth:$SHORT_SHA", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/groundtruth:$SHORT_SHA"]
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "groundtruth", "--image", "$_REGION-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/groundtruth:$SHORT_SHA",
           "--region", "$_REGION", "--allow-unauthenticated", "--memory", "1Gi",
           "--set-env-vars", "GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GEMINI_LOCATION=us-central1"]
substitutions:
  _REGION: asia-south1
options:
  logging: CLOUD_LOGGING_ONLY
